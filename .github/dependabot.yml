version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Let new releases age before adopting them: most malicious uploads
    # (litellm 1.82.7/1.82.8 were live for under three hours) are pulled
    # within days. Security updates are not delayed by this.
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
