name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): there is no PyPI token
# stored anywhere to leak — the March 2026 litellm/telnyx compromise came
# from exactly such a long-lived token. One-time setup on pypi.org: add a
# trusted publisher for this repo, workflow `release.yml`, environment
# `pypi`; protect that GitHub environment with a required reviewer.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Test the exact tree being released
        run: |
          uv sync --locked --extra dev --python 3.13
          uv run --no-sync pytest
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/marshal-ai
    permissions:
      id-token: write # OIDC for Trusted Publishing and Sigstore attestations
      attestations: write # GitHub build provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # PEP 740 attestations are generated and uploaded by default.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
